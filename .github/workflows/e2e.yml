name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.64.1-noble"
  COMPOSE_PROJECT_NAME: step-ca-webui

jobs:
  image:
    name: build e2e images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build the backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: step-ca-webui-backend:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,scope=e2e-backend,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./frontend/Dockerfile
          tags: step-ca-webui-web:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,scope=e2e-frontend,mode=max

      - name: Neither runtime image contains Node
        run: |
          for img in step-ca-webui-backend:e2e step-ca-webui-web:e2e; do
            docker run --rm --entrypoint sh "$img" -c '! command -v node && ! command -v npm'
          done

      - name: Save both application images into one archive
        run: docker save step-ca-webui-backend:e2e step-ca-webui-web:e2e | gzip -1 > e2e-images.tar.gz

      - name: Upload the application images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Build the harness image (Playwright base plus docker CLI)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./test/e2e
          file: ./test/e2e/Dockerfile
          build-args: |
            PLAYWRIGHT_IMAGE=${{ env.PLAYWRIGHT_IMAGE }}
          tags: step-ca-webui-harness:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-harness
          cache-to: type=gha,scope=e2e-harness,mode=max

  e2e-main:
    name: e2e main suite
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Download the application images
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-images

      - name: Load the application images
        run: |
          gunzip -c e2e-images.tar.gz | docker load
          rm e2e-images.tar.gz

      - name: Materialise the harness image from the layer cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./test/e2e
          file: ./test/e2e/Dockerfile
          build-args: |
            PLAYWRIGHT_IMAGE=${{ env.PLAYWRIGHT_IMAGE }}
          tags: step-ca-webui-harness:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-harness

      - name: Generate secrets in-job
        run: |
          make setup FORCE=1
          ADMIN_PW="$(openssl rand -base64 24)"
          echo "::add-mask::${ADMIN_PW}"
          cp .env.example .env
          {
            echo "STEPWEBUI_ADMIN_PASSWORD=${ADMIN_PW}"
            echo "WEB_HOSTNAME=step-webui-web"
            echo "PUBLIC_BASE_URL=https://step-webui-web:8443"
            echo "SESSION_SECURE=true"
          } >> .env
          chmod 644 secrets/*

      - name: Bring up the stack
        run: docker compose -f docker-compose.yml -f compose.e2e-image.yml up -d --wait

      - name: The backend publishes no host port
        run: ./scripts/check-backend-port.sh --running

      - name: Run the api project
        run: |
          docker run --rm \
            --network step-network \
            -v "$PWD:/repo" -v /var/run/docker.sock:/var/run/docker.sock \
            -w /e2e \
            -e BASE_URL=https://step-webui-web:8443 \
            -e BACKEND_URL=https://step-webui:8443 \
            -e E2E_REPO_ROOT=/repo \
            -e E2E_ARTIFACT_DIR=/repo/test/e2e/artifacts \
            -e COMPOSE_PROJECT_NAME=step-ca-webui \
            -e CI=true \
            step-ca-webui-harness:e2e \
            npx playwright test --project=api

      - name: Run the SPA specs of the ui project
        run: |
          docker run --rm \
            --network step-network \
            -v "$PWD:/repo" -v /var/run/docker.sock:/var/run/docker.sock \
            -w /e2e \
            -e BASE_URL=https://step-webui-web:8443 \
            -e BACKEND_URL=https://step-webui:8443 \
            -e E2E_REPO_ROOT=/repo \
            -e E2E_ARTIFACT_DIR=/repo/test/e2e/artifacts/ui \
            -e COMPOSE_PROJECT_NAME=step-ca-webui \
            -e CI=true \
            step-ca-webui-harness:e2e \
            npx playwright test --project=ui specs/spa

      - name: Collect artifacts
        if: always()
        run: ./test/e2e/collect.sh artifacts/

      - name: Assert the artifact carries no secrets
        if: always()
        run: ./test/e2e/assert-redacted.sh artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-main-${{ github.run_attempt }}
          path: |
            artifacts/
            test/e2e/artifacts/
          if-no-files-found: error

  e2e-gate:
    name: e2e
    needs:
      - e2e-main
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every e2e job succeeded
        run: test "${{ needs.e2e-main.result }}" = success
